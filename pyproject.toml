[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pixel-asset-engine"
version = "0.2.0"
description = "A mão de uma IA para pixel art: a composição em dados vira o asset completo de jogo."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pillow>=10.4",
  "pydantic>=2.8,<3",
]

[project.scripts]
pfe = "pixel_forge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: testes longos (fora do ciclo rápido)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ARG", "ERA", "C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
